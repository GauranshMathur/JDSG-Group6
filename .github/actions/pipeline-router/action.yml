name: Pipeline router
description: >
  Picks which child pipelines a pull request needs from the files it changes,
  and returns them as a JSON array.

inputs:
  rules:
    description: >
      One "pipeline:regex" per line. A changed file matching the regex selects
      that pipeline. A pipeline may have several rules, and a path may select
      more than one pipeline.
    required: true
  default:
    description: >
      Pipelines to add when a changed file matches no rule at all, space- or
      comma-separated. Naming every pipeline here is the safe choice: a file
      type nobody anticipated then gets checked rather than slipping through.
    required: false
    default: ""
  base:
    description: Commit to diff from. Required unless `files` is given.
    required: false
    default: ""
  head:
    description: Commit to diff to. Required unless `files` is given.
    required: false
    default: ""
  files:
    description: >
      Newline-separated changed paths, if you would rather supply them than
      have the action derive them from base..head with git.
    required: false
    default: ""

outputs:
  selected:
    description: JSON array of the selected pipelines, e.g. ["app","infra"].
    value: ${{ steps.select.outputs.selected }}

runs:
  using: composite
  steps:
    - id: select
      shell: bash
      # The logic is in route.sh rather than inline here so that test-route.sh
      # exercises the script this action actually runs, instead of a copy free
      # to drift from it.
      #
      # Values arrive through the environment rather than ${{ }} interpolation,
      # which would splice them into the script as shell.
      env:
        RULES: ${{ inputs.rules }}
        DEFAULT: ${{ inputs.default }}
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        FILES: ${{ inputs.files }}
      run: ${{ github.action_path }}/route.sh
