name: Security

# Deliberately unfiltered, unlike ci.yml. Whatever a pull request changes, the
# tree gets scanned for committed secrets — a credential pasted into a markdown
# file is every bit as leaked as one in a Ruby file.
#
# It is also what makes the `Trivy` code-scanning check appear on every pull
# request. That check is created by the SARIF upload rather than being a job, so
# when the only upload lived in the container job, documentation-only pull
# requests never created it and GitHub listed it as expected and waiting for a
# status that was never coming. It read exactly like a job refusing to be
# scheduled.
#
# Being unconditional also makes this the one check safe to require on main
# while ci.yml is path-filtered — see docs/ci-cd.md.
on:
  pull_request:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sast:
    name: SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # Rails-aware static analysis: SQL injection, mass assignment, unsafe
      # redirects, XSS.
      - name: Brakeman
        working-directory: web
        run: bundle exec brakeman --no-pager --format plain

      # Known CVEs in the locked gem versions.
      - name: Bundler Audit
        working-directory: web
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check

      # Dependency and secret scanning over the source tree. These are findings
      # in code we control, so any HIGH or CRITICAL fails the build.
      #
      # web/vendor is skipped because setup-ruby installs gems there at CI time,
      # and scanning it reports on the *internals of third-party gems* — puma's
      # own tools/Dockerfile, the railties devcontainer template, lint_roller's
      # development Gemfile.lock. None of that is our code or reaches our image:
      # vendor/bundle is not in git, so the Docker build never copies it.
      #
      # This does not weaken dependency scanning. Our actual dependencies are
      # covered twice over — bundler-audit runs against web/Gemfile.lock above,
      # and Trivy still picks that same lockfile up here.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: web/vendor
          exit-code: "1"

      # The gating scan above only sets an exit code — its findings went nowhere.
      # This second pass reports every severity into the Security tab: one scan
      # decides pass or fail, the other is the record.
      #
      # always(), so a failing gate publishes what it found rather than hiding
      # it. A scan that fails the build without saying why is the less useful
      # half of the two.
      - name: Trivy filesystem scan (report all severities)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          skip-dirs: web/vendor
          exit-code: "0"

      - name: Upload filesystem scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
