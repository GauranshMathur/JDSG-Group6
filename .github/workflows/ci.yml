name: CI

# Pull requests only. Every check here runs against the branch before it merges,
# and release.yml deliberately does not repeat them on main: re-running the same
# suite against the same code would double the work to reach the same answer.
#
# The consequence is that the pull request is the only gate, so it has to be a
# real one. Enable "Require branches to be up to date before merging" on main —
# without it two branches can each pass in isolation and still break once merged,
# and nothing downstream will notice.
on:
  pull_request:

# A new push to a pull request makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which of the jobs below are worth running for this pull request.
  #
  # A documentation change cannot break RuboCop, the specs or the container, so
  # building and scanning an image for it is minutes spent to learn nothing.
  #
  # This is filtered per job rather than with paths-ignore on the trigger, and the
  # difference matters once main has required status checks: a workflow skipped by
  # paths-ignore never reports its checks at all, so the pull request waits forever
  # for a result that will never arrive. A job skipped by an `if` reports a
  # "skipped" conclusion, which satisfies the requirement.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both ends of the comparison have to be present locally.
          fetch-depth: 0

      - name: Classify the changed files
        id: filter
        run: |
          set -euo pipefail

          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")

          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Anything that is not documentation counts as code. Deciding it this way
          # round is deliberate: a new file type nobody thought about is treated as
          # code and gets checked, rather than slipping through unchecked.
          if [ -z "$changed" ]; then
            code=false
          elif echo "$changed" | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            code=true
          else
            code=false
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "::notice::Code changed — running the full pipeline."
          else
            echo "::notice::Documentation only — skipping lint, tests and the container build."
          fi

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: RuboCop
        working-directory: web
        run: bundle exec rubocop --parallel

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # The suite runs on SQLite, matching development. No services required.
      - name: RSpec
        working-directory: web
        env:
          RAILS_ENV: test
        run: bundle exec rspec --format documentation

  # This job always runs, unlike the others. The Ruby-specific analysis below is
  # skipped for a documentation-only change, but the Trivy scan is not: it also
  # looks for committed secrets, and a credential pasted into a markdown file is
  # every bit as leaked as one in a Ruby file.
  sast:
    name: SAST
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        if: needs.changes.outputs.code == 'true'
        with:
          working-directory: web
          bundler-cache: true

      # Rails-aware static analysis: SQL injection, mass assignment, unsafe
      # redirects, XSS.
      - name: Brakeman
        if: needs.changes.outputs.code == 'true'
        working-directory: web
        run: bundle exec brakeman --no-pager --format plain

      # Known CVEs in the locked gem versions.
      - name: Bundler Audit
        if: needs.changes.outputs.code == 'true'
        working-directory: web
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check

      # Dependency and secret scanning over the source tree. These are findings
      # in code we control, so any HIGH or CRITICAL fails the build.
      #
      # web/vendor is skipped because setup-ruby installs gems there at CI time,
      # and scanning it reports on the *internals of third-party gems* — puma's
      # own tools/Dockerfile, the railties devcontainer template, lint_roller's
      # development Gemfile.lock. None of that is our code or reaches our image:
      # vendor/bundle is not in git, so the Docker build never copies it.
      #
      # This does not weaken dependency scanning. Our actual dependencies are
      # covered twice over — bundler-audit runs against web/Gemfile.lock above,
      # and Trivy still picks that same lockfile up here.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: web/vendor
          exit-code: "1"

  container:
    name: Container build, image scan and DAST
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built once and reused by the scan and the DAST run below, so the image
      # that gets scanned is the image that gets exercised.
      #
      # Single-architecture on purpose, unlike the release build. This image is
      # only ever scanned and booted on this runner, `load: true` cannot take a
      # multi-platform manifest list anyway, and building arm64 under QEMU would
      # add minutes to every pull request for no extra signal. The Dockerfile is
      # shared, so a genuinely architecture-specific break would still surface in
      # the release build.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          push: false
          tags: twitter-clone-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same threshold as the filesystem scan: HIGH and CRITICAL fail, MEDIUM and
      # LOW are reported without blocking. A failure here is a signal that the
      # base image needs bumping or a package needs patching — treat it as work
      # to do, not as noise to route around.
      #
      # ignore-unfixed keeps this achievable: only findings with a fix available
      # count. A HIGH with no upstream patch cannot be actioned by any change in
      # this repository, so failing on it would just teach everyone to ignore
      # the gate.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan (report all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Start the container
        run: |
          docker run -d --name web -p 3000:80 \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e RAILS_LOG_TO_STDOUT=1 \
            twitter-clone-web:${{ github.sha }}

      # Proves the image actually boots and serves, not just that it builds.
      - name: Wait for the app to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/up > /dev/null; then
              echo "App is up after ${attempt}s"
              curl -fsS http://localhost:3000/ | grep -q "Feed" && echo "Feed renders"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy in time"
          docker logs web
          exit 1

      # Posting is the one thing the app does, so CI has to actually do it.
      #
      # Polling /up and rendering the feed are both GETs, and every way this has
      # broken so far has broken writes while leaving reads healthy — a CSRF
      # origin mismatch under assume_ssl returns 422 on POST and nothing at all
      # on GET. A green pipeline meant nothing here until this step existed.
      #
      # The checks live in web/script/smoke-test rather than inline here, so the
      # same script runs against a local server. A failure in CI is reproducible
      # with one command instead of by pushing again.
      - name: Smoke test registering and posting
        run: web/script/smoke-test http://localhost:3000

      # DAST: an unauthenticated baseline crawl of the running container.
      #
      # fail_action is false for now — a baseline scan of a fresh Rails app
      # reports header-level warnings (CSP, permissions policy) that are real but
      # out of scope for this milestone. Triage them, then flip this to true so
      # regressions fail the build.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"

      # Guarded because these run even when an earlier step failed before the
      # container was ever created, and "No such container" should not add a
      # second, misleading failure on top of the real one.
      - name: Container logs
        if: always()
        run: docker logs web || echo "No container to log."

      - name: Stop the container
        if: always()
        run: docker rm -f web || true

  sonarqube:
    name: SonarQube
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute issues to the commit that
          # introduced them.
          fetch-depth: 0

      # The scan is skipped rather than failed when the project has no SonarQube
      # credentials yet, so this job does not block pull requests before the
      # server is configured. Add SONAR_TOKEN (and SONAR_HOST_URL for a
      # self-hosted server) to repository secrets to switch it on.
      - name: Check for SonarQube credentials
        id: sonar_check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set — skipping the SonarQube scan."
          fi

      - name: SonarQube scan
        if: steps.sonar_check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
