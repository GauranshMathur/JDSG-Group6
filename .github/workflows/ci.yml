name: CI

# The parent pipeline. It decides *which* pipeline a pull request needs and
# calls it; it runs no checks of its own.
#
# GitHub has no parent/child pipelines as such. The equivalent is a reusable
# workflow — `on: workflow_call` in the child, `uses:` in the parent — which
# behaves like GitLab's `trigger` with `strategy: depend`: the calling job waits
# for the child and can read its outputs.
#
# Routing is by a tag in the pull request title: [APP], [INFRA] or [DOC]. More
# than one may appear. A title with none of them runs everything, on the
# principle that an unrouted change should be over-checked rather than waved
# through.
#
# The trade this accepts: the tag is a claim, while a diff is evidence. A pull
# request titled [DOC] that edits web/ will skip the specs. That is the cost of
# declaring the pipeline rather than deriving it.
on:
  pull_request:
    # `edited` matters: without it, a pull request opened as [DOC] and retitled
    # to [APP] would keep the checks it got the first time round.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    name: Route
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.route.outputs.app }}
      infra: ${{ steps.route.outputs.infra }}
      docs: ${{ steps.route.outputs.docs }}
    steps:
      - name: Read the tag from the pull request title
        id: route
        # The title is attacker-controlled — anyone able to open a pull request
        # chooses it — so it arrives through the environment. Interpolating
        # ${{ ... }} straight into a run block would let a crafted title inject
        # shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          app=false
          infra=false
          docs=false

          if grep -qiE '\[app\]'   <<< "$TITLE"; then app=true;   fi
          if grep -qiE '\[infra\]' <<< "$TITLE"; then infra=true; fi
          if grep -qiE '\[docs?\]' <<< "$TITLE"; then docs=true;  fi

          if [ "$app" = false ] && [ "$infra" = false ] && [ "$docs" = false ]; then
            echo "::warning::No [APP], [INFRA] or [DOC] tag in the title — running every pipeline. Tag the title to route it."
            app=true
            infra=true
          fi

          {
            echo "app=$app"
            echo "infra=$infra"
            echo "docs=$docs"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Title: $TITLE"
          echo "::notice::Pipelines — app=$app infra=$infra docs=$docs"

  app:
    name: App
    needs: route
    if: needs.route.outputs.app == 'true'
    uses: ./.github/workflows/ci-app.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  infra:
    name: Infra
    needs: route
    if: needs.route.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read

  # Never routed around. Its Ruby-specific analysis is gated on the app pipeline
  # being in play, but the Trivy scan is not: it looks for committed secrets, and
  # a credential pasted into a markdown file is every bit as leaked as one in a
  # Ruby file. Running it unconditionally is also what makes the `Trivy`
  # code-scanning check appear on every pull request rather than only on some.
  security:
    name: Security
    needs: route
    uses: ./.github/workflows/ci-security.yml
    permissions:
      contents: read
      security-events: write
    with:
      ruby: ${{ needs.route.outputs.app == 'true' }}

  # The one check to require on main.
  #
  # A reusable workflow that is never called contributes no check runs at all —
  # the same trap `paths-ignore` sets, and the reason the old `Trivy` check used
  # to hang a documentation pull request forever. Requiring `App / Lint` would
  # deadlock every [INFRA] pull request on a status that is never coming.
  #
  # This job always runs, so it always reports, and it is red if any pipeline
  # that *did* run came back red.
  gate:
    name: CI
    needs: [route, app, infra, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any pipeline that ran did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          if grep -qE '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled)"' <<< "$RESULTS"; then
            echo "::error::A pipeline failed. See the jobs above."
            exit 1
          fi

          echo "Every pipeline that ran passed; the rest were not routed to."
