name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# A new push to a pull request makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: RuboCop
        working-directory: web
        run: bundle exec rubocop --parallel

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # The suite runs on SQLite, matching development. No services required.
      - name: RSpec
        working-directory: web
        env:
          RAILS_ENV: test
        run: bundle exec rspec --format documentation

  sast:
    name: SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # Rails-aware static analysis: SQL injection, mass assignment, unsafe
      # redirects, XSS.
      - name: Brakeman
        working-directory: web
        run: bundle exec brakeman --no-pager --format plain

      # Known CVEs in the locked gem versions.
      - name: Bundler Audit
        working-directory: web
        run: |
          bundle exec bundler-audit update
          bundle exec bundler-audit check

      # Dependency and secret scanning over the source tree. These are findings
      # in code we control, so any HIGH or CRITICAL fails the build.
      #
      # web/vendor is skipped because setup-ruby installs gems there at CI time,
      # and scanning it reports on the *internals of third-party gems* — puma's
      # own tools/Dockerfile, the railties devcontainer template, lint_roller's
      # development Gemfile.lock. None of that is our code or reaches our image:
      # vendor/bundle is not in git, so the Docker build never copies it.
      #
      # This does not weaken dependency scanning. Our actual dependencies are
      # covered twice over — bundler-audit runs against web/Gemfile.lock above,
      # and Trivy still picks that same lockfile up here.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: web/vendor
          exit-code: "1"

  container:
    name: Container build, image scan and DAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built once and reused by the scan and the DAST run below, so the image
      # that gets scanned is the image that gets exercised.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          push: false
          tags: twitter-clone-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same threshold as the filesystem scan: HIGH and CRITICAL fail, MEDIUM and
      # LOW are reported without blocking. A failure here is a signal that the
      # base image needs bumping or a package needs patching — treat it as work
      # to do, not as noise to route around.
      #
      # ignore-unfixed keeps this achievable: only findings with a fix available
      # count. A HIGH with no upstream patch cannot be actioned by any change in
      # this repository, so failing on it would just teach everyone to ignore
      # the gate.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy image scan (report all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Start the container
        run: |
          docker run -d --name web -p 3000:80 \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE=$(openssl rand -hex 64) \
            -e RAILS_LOG_TO_STDOUT=1 \
            twitter-clone-web:${{ github.sha }}

      # Proves the image actually boots and serves, not just that it builds.
      - name: Wait for the app to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/up > /dev/null; then
              echo "App is up after ${attempt}s"
              curl -fsS http://localhost:3000/ | grep -q "Feed" && echo "Feed renders"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy in time"
          docker logs web
          exit 1

      # DAST: an unauthenticated baseline crawl of the running container.
      #
      # fail_action is false for now — a baseline scan of a fresh Rails app
      # reports header-level warnings (CSP, permissions policy) that are real but
      # out of scope for this milestone. Triage them, then flip this to true so
      # regressions fail the build.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"

      # Guarded because these run even when an earlier step failed before the
      # container was ever created, and "No such container" should not add a
      # second, misleading failure on top of the real one.
      - name: Container logs
        if: always()
        run: docker logs web || echo "No container to log."

      - name: Stop the container
        if: always()
        run: docker rm -f web || true

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute issues to the commit that
          # introduced them.
          fetch-depth: 0

      # The scan is skipped rather than failed when the project has no SonarQube
      # credentials yet, so this job does not block pull requests before the
      # server is configured. Add SONAR_TOKEN (and SONAR_HOST_URL for a
      # self-hosted server) to repository secrets to switch it on.
      - name: Check for SonarQube credentials
        id: sonar_check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set — skipping the SonarQube scan."
          fi

      - name: SonarQube scan
        if: steps.sonar_check.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
