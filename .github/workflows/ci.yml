name: CI

# The parent pipeline. It decides which child pipelines a pull request needs and
# calls them; it runs no build of its own.
#
# GitHub has no parent/child pipelines as such. The equivalent is a reusable
# workflow — `on: workflow_call` in the child, `uses:` in the parent — which
# behaves like GitLab's `trigger` with `strategy: depend`: the calling job waits
# for the child and can read its outputs.
#
# Routing is by changed path, which is the convention GitHub repositories
# settled on. The rules live in the `route` job below.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The pipeline's own checks, and never routed around — routing decides which
  # checks a pull request gets, so a broken router is the one failure that can
  # make a pull request green by testing nothing at all. Every pipeline skips,
  # the gate sees nothing that failed, and it reads as a pass. You cannot use a
  # routed pipeline to test the router, so this sits outside the routing.
  selftest:
    name: Pipeline self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Catches what a YAML parser cannot: expression injection, invalid
      # `needs:` references, deprecated syntax — and it runs shellcheck over
      # every `run:` block, so the bash in these workflows is linted too.
      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: true

      - name: Router
        run: .github/actions/pipeline-router/test-route.sh

      # These tests existed and had never run in CI: the script that derives
      # every release version was guarded only by someone remembering to run it,
      # and it has shipped a wrong tag twice.
      - name: Version derivation
        run: .github/scripts/test-next-version.sh

  route:
    name: Route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.route.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both ends of the comparison have to be present locally.
          fetch-depth: 0

      - uses: ./.github/actions/pipeline-router
        id: route
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # A workflow change selects app and infra because it can break either
          # pipeline. Documentation selects neither.
          rules: |
            app:^web/
            app:^\.github/
            infra:^infra/
            infra:^\.github/
            docs:^docs/
            docs:\.md$
            docs:^LICENSE$
          # What an unclassified file pulls in. Naming both is deliberate: a
          # path nobody anticipated gets checked rather than slipping through,
          # so the failure mode is running too much, never too little.
          default: app infra

  app:
    name: App
    needs: route
    if: contains(fromJSON(needs.route.outputs.selected), 'app')
    uses: ./.github/workflows/ci-app.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  infra:
    name: Infra
    needs: route
    if: contains(fromJSON(needs.route.outputs.selected), 'infra')
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read

  # Never routed around. Its Ruby-specific analysis is gated on the app pipeline
  # being in play, but the Trivy scan is not: it looks for committed secrets, and
  # a credential pasted into a markdown file is every bit as leaked as one in a
  # Ruby file. Running it unconditionally is also what makes the `Trivy`
  # code-scanning check appear on every pull request rather than only on some.
  security:
    name: Security
    needs: route
    uses: ./.github/workflows/ci-security.yml
    permissions:
      contents: read
      security-events: write
    with:
      ruby: ${{ contains(fromJSON(needs.route.outputs.selected), 'app') }}

  # The one check to require on main.
  #
  # A reusable workflow that is never called contributes no check runs at all —
  # the same trap `paths-ignore` sets. Requiring `App / Lint` would deadlock
  # every infrastructure-only pull request on a status that is never coming.
  #
  # This job always runs, so it always reports, and it is red if any pipeline
  # that did run came back red.
  gate:
    name: CI
    needs: [selftest, route, app, infra, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any pipeline that ran did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          if grep -qE '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled)"' <<< "$RESULTS"; then
            echo "::error::A pipeline failed. See the jobs above."
            exit 1
          fi

          echo "Every pipeline that ran passed; the rest were not routed to."
