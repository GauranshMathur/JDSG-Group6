name: CI

# The parent pipeline. It decides which child pipelines a pull request needs and
# calls them; it runs no checks of its own.
#
# The routing itself lives in .github/actions/pipeline-router, which is written
# to be lifted into another project — see its README for the pattern and the two
# traps that come with it.
on:
  pull_request:
    # `edited` matters: without it, a pull request opened as [DOC] and retitled
    # to [APP] would keep the checks it got the first time round.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The pipeline's own smoke test, and never routed around — routing decides
  # which checks a pull request gets, so a broken router is the one failure that
  # can make a pull request green by testing nothing at all. Every pipeline is
  # skipped, the gate sees nothing that failed, and it reads as a pass.
  #
  # next-version.sh is tested here too. Its suite existed and had never run in
  # CI: the script that decides every release version was guarded only by
  # someone remembering to run it, and it has shipped a wrong tag twice.
  selftest:
    name: Pipeline self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Router
        run: .github/actions/pipeline-router/test-route.sh

      - name: Version derivation
        run: .github/scripts/test-next-version.sh

  route:
    name: Route
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.route.outputs.selected }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pipeline-router
        id: route
        with:
          title: ${{ github.event.pull_request.title }}
          tags: app infra doc
          # Every pipeline, so an untagged pull request is over-checked rather
          # than waved through.
          fallback: app infra

  app:
    name: App
    needs: route
    if: contains(fromJSON(needs.route.outputs.selected), 'app')
    uses: ./.github/workflows/ci-app.yml
    permissions:
      contents: read
      security-events: write
    secrets: inherit

  infra:
    name: Infra
    needs: route
    if: contains(fromJSON(needs.route.outputs.selected), 'infra')
    uses: ./.github/workflows/ci-infra.yml
    permissions:
      contents: read

  # Never routed around. Its Ruby-specific analysis is gated on the app pipeline
  # being in play, but the Trivy scan is not: it looks for committed secrets, and
  # a credential pasted into a markdown file is every bit as leaked as one in a
  # Ruby file. Running it unconditionally is also what makes the `Trivy`
  # code-scanning check appear on every pull request rather than only on some.
  security:
    name: Security
    needs: route
    uses: ./.github/workflows/ci-security.yml
    permissions:
      contents: read
      security-events: write
    with:
      ruby: ${{ contains(fromJSON(needs.route.outputs.selected), 'app') }}

  # The one check to require on main.
  #
  # A reusable workflow that is never called contributes no check runs at all —
  # the same trap `paths-ignore` sets. Requiring `App / Lint` would deadlock
  # every [INFRA] pull request on a status that is never coming.
  #
  # This job always runs, so it always reports, and it is red if any pipeline
  # that did run came back red.
  gate:
    name: CI
    needs: [selftest, route, app, infra, security]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any pipeline that ran did not pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          if grep -qE '"result"[[:space:]]*:[[:space:]]*"(failure|cancelled)"' <<< "$RESULTS"; then
            echo "::error::A pipeline failed. See the jobs above."
            exit 1
          fi

          echo "Every pipeline that ran passed; the rest were not routed to."
