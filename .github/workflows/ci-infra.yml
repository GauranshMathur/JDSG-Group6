name: Infra pipeline

# The infrastructure pipeline. Called by ci.yml when a pull request touches
# infra/ (or a workflow) — never triggered on its own.
#
# Today it checks the Compose files, because that is all `infra/` holds. The
# Terraform steps arrive with the Terraform itself in I-1b, rather than being
# scaffolded here first against nothing:
#
#   terraform fmt -check -recursive
#   terraform init -backend=false && terraform validate
#   terraform apply against a floci service container, then destroy  (I-1c)
#
# That last one is the gate ADR 0008 promises. It needs a Docker daemon, which
# these runners have and a laptop may not — so CI, not a local run, is where the
# emulator is exercised.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  compose:
    name: Compose files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # `config` resolves and validates the file — interpolation, merges, unknown
      # keys — without starting anything.
      - name: Validate the Compose files
        run: |
          set -euo pipefail
          found=0
          for file in infra/docker/*.yml infra/docker/*.yaml; do
            [ -e "$file" ] || continue
            found=1
            echo "Validating $file"
            docker compose -f "$file" config --quiet
          done

          if [ "$found" -eq 0 ]; then
            echo "::error::No Compose files found under infra/docker — this job expects at least one."
            exit 1
          fi

          echo "All Compose files are valid."

  # Terraform, Kubernetes manifests and shell all live under infra/, and Trivy's
  # misconfiguration scanner covers the first two. Scoping a scan to infra/ here
  # means an infrastructure pull request gets a finding attributed to its own
  # pipeline rather than only to the repository-wide scan in ci-security.yml.
  misconfig:
    name: Misconfiguration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "1"
