name: Release

# Runs after a pull request lands on the default branch. CI has already passed on
# the merge commit's contents by this point; this workflow only decides whether
# the merge warrants a version and publishes the image if so.
on:
  push:
    branches: [ main ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
      released: ${{ steps.next.outputs.version != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the range since the last tag can be walked.
          fetch-depth: 0

      # Derives the next SemVer from the Conventional Commit prefixes since the
      # last v* tag: feat -> minor, fix/perf -> patch, ! or a BREAKING CHANGE
      # footer -> major. A push carrying only docs/chore/test/ci commits produces
      # no version, and every job below is skipped.
      #
      # This is deliberately hand-rolled rather than an off-the-shelf action.
      # github-tag-action, the obvious choice, cannot bootstrap: with no existing
      # tag it has no range to diff against, reports "Analysis of 0 commits" and
      # silently declines to release — so the very first version never gets cut.
      # Treating "no tag" as "consider the whole history" is the only difference,
      # and it is not worth a dependency that gets it wrong.
      - name: Determine next version
        id: next
        run: |
          set -euo pipefail

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)

          if [ -z "$latest_tag" ]; then
            range=""
            previous="0.0.0"
            echo "No previous tag; considering the full history."
          else
            range="${latest_tag}..HEAD"
            previous="${latest_tag#v}"
            echo "Previous tag ${latest_tag}; considering ${range}."
          fi

          # Subject then body per commit, with a record separator so one commit's
          # BREAKING CHANGE footer cannot be misread as belonging to the next.
          commits=$(git log --format=$'%s%n%b\x1e' ${range:+"$range"})

          bump="none"
          while IFS= read -r -d $'\x1e' commit; do
            [ -z "${commit//[[:space:]]/}" ] && continue

            # The first non-blank line, not simply the first line. Every record
            # after the newest begins with the newline that terminated the
            # previous one, so taking line 1 yields an empty subject and the
            # commit goes unclassified — which silently under-bumps whenever the
            # release-worthy commit is not the newest one in the range.
            subject=$(printf '%s\n' "$commit" | grep -m1 -v '^[[:space:]]*$' || true)

            if printf '%s\n' "$commit" | grep -qE '^BREAKING[ -]CHANGE:' ||
               printf '%s\n' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
              bump="major"
              break
            elif printf '%s\n' "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
              bump="minor"
            elif printf '%s\n' "$subject" | grep -qE '^(fix|perf)(\([^)]*\))?:'; then
              [ "$bump" = "minor" ] || bump="patch"
            fi
          done <<< "$commits"

          IFS=. read -r major minor patch <<< "$previous"

          case "$bump" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            none)
              echo "No release-worthy commits since ${latest_tag:-the start of history}."
              {
                echo "bump=none"
                echo "version="
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "Bump: ${bump}. Next version: ${major}.${minor}.${patch}."
          {
            echo "bump=$bump"
            echo "version=${major}.${minor}.${patch}"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Creates the tag at this commit as well as the release, so nothing needs
      # to push a tag separately.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true

  image:
    name: Build and publish image
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing to GHCR. The built-in GITHUB_TOKEN is enough — no secret to
      # create, no registry to provision.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GHCR rejects upper-case characters in an image name, and the owner here
      # is mixed case, so it cannot be interpolated directly.
      - name: Compute image name
        id: image
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/twitter-clone-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Amazon ECR — not yet. GHCR above is the registry while the app has
      # nowhere to deploy to; ECR arrives with the AWS work, at which point the
      # image can go to both.
      #
      # Required before enabling:
      #   - An ECR repository for the app.
      #   - An IAM role trusting this repository through GitHub's OIDC provider.
      #   - Repository variables AWS_REGION, AWS_ACCOUNT_ID and ECR_REPOSITORY.
      #   - id-token: write added to this job's permissions, for OIDC.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
      #     aws-region: ${{ vars.AWS_REGION }}
      #
      # - name: Log in to Amazon ECR
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # Then add these to the tag list below:
      #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.version.outputs.version }}
      #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}
      #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
      # ---------------------------------------------------------------------

      # Three tags: the semantic version, an immutable sha- tag so a deployment
      # can be pinned to an exact build, and latest.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          echo "Version:  ${{ needs.version.outputs.version }}"
          echo "Image:    ${{ steps.image.outputs.name }}"
          echo "Tags:     ${{ needs.version.outputs.version }}, sha-${{ github.sha }}, latest"
          echo "Registry: ghcr.io. ECR is commented out in this workflow until AWS exists."
