name: Release

# Runs after a pull request lands on the default branch. CI has already passed on
# the merge commit's contents by this point; this workflow only decides whether
# the merge warrants a version and publishes the image if so.
on:
  push:
    branches: [ main, claude/main ]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
      changelog: ${{ steps.tag.outputs.changelog }}
      released: ${{ steps.tag.outputs.new_tag != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Derives the next SemVer from the Conventional Commit prefixes since the
      # last tag: feat -> minor, fix/perf -> patch, ! or BREAKING CHANGE -> major.
      # A push containing only docs/chore/test/ci commits produces no tag, and
      # every job below is skipped.
      - name: Determine next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main,claude/main
          tag_prefix: v

  release:
    name: Publish release
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_tag }}
          name: ${{ needs.version.outputs.new_tag }}
          body: ${{ needs.version.outputs.changelog }}

  image:
    name: Build and publish image
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required by aws-actions/configure-aws-credentials for OIDC, once the ECR
      # push below is enabled.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------------
      # ECR push — intentionally disabled.
      #
      # Uncomment this block, and the push/tags settings in the build step
      # below, once the AWS account, the ECR repository and the OIDC role are
      # actually provisioned. Enabling it before then only produces red builds.
      #
      # Required beforehand:
      #   - An ECR repository for the app.
      #   - An IAM role trusting this repository through GitHub's OIDC provider.
      #   - Repository variables AWS_REGION, AWS_ACCOUNT_ID and ECR_REPOSITORY.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
      #     aws-region: ${{ vars.AWS_REGION }}
      #
      # - name: Log in to Amazon ECR
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      # ---------------------------------------------------------------------

      # Every image carries three tags: the semantic version, an immutable
      # sha- tag so a deploy can be pinned to an exact build, and latest.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web
          # Flip to true when the ECR block above is enabled.
          push: false
          load: true
          tags: |
            twitter-clone-web:${{ needs.version.outputs.new_version }}
            twitter-clone-web:sha-${{ github.sha }}
            twitter-clone-web:latest
          # Replace the tags above with these once ECR is live:
          # tags: |
          #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.version.outputs.new_version }}
          #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}
          #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what would be published
        run: |
          echo "Version:  ${{ needs.version.outputs.new_version }}"
          echo "Tags:     ${{ needs.version.outputs.new_version }}, sha-${{ github.sha }}, latest"
          echo "Registry: ECR push is disabled — see the commented block in this workflow."
